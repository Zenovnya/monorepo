# Автоматические PR на обновление зависимостей.
#
# Зачем: `pip-audit` в CI ловит уязвимые версии, но не обновляет их. Без
# dependabot уязвимость находят на ревью или, хуже, в проде.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "deps(backend)"

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - mobile
    commit-message:
      prefix: "deps(mobile)"
    # Expo обновляется связкой: отдельный bump react-native или expo-* ломает
    # совместимость, поэтому такие пакеты обновляем вручную через `expo install`.
    #
    # Список ниже закрывает целые семейства, а не отдельные пакеты. Причина —
    # dependabot не знает про `bundledNativeModules.json` и присылает версии из
    # другого мажорного SDK: в проекте на SDK 54 приходили expo-notifications
    # 58.1.9, @expo/metro-runtime 58.0.17, babel-preset-expo 58.0.25 (у него
    # peer expo-widgets ^58.0.28, которого в проекте нет), async-storage 3.1.1
    # и react-native-worklets 0.13.1. У нативных модулей peer-зависимости
    # заданы как `*`, поэтому `npm ci` и eslint на таких PR ЗЕЛЁНЫЕ — поломка
    # видна только на `expo start` или EAS-сборке, где диагностика дороже.
    #
    # Обновление нативного модуля = обновление SDK: `npx expo install --check`
    # и `npx expo-doctor`, отдельной задачей. Добавление нового пакета в список
    # не нужно — семейства покрыты масками.
    ignore:
      # Ядро Expo и React Native.
      - dependency-name: expo
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: react-native
      - dependency-name: react
      # react-dom/react-native-web обязаны совпадать по версии с react и
      # react-native: SDK 54 пинит 19.1.0 и ~0.21.0. Bump в одиночку ломает
      # рендер на вебе (две копии React).
      - dependency-name: react-dom
      - dependency-name: react-native-web
      # Все `expo-*` (expo-notifications, expo-constants, expo-font, ...).
      - dependency-name: expo-*
      # Все `@expo/*` (@expo/metro-runtime, @expo/vector-icons, ...).
      - dependency-name: '@expo/*'
      # Нативные модули с собственным мажором вне SDK.
      - dependency-name: babel-preset-expo
      - dependency-name: react-native-worklets
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-gesture-handler
      - dependency-name: react-native-screens
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-svg
      - dependency-name: '@react-native-async-storage/async-storage'
      - dependency-name: '@react-native-community/*'
      # @babel/core: восьмёрку поддерживает только worklets 0.13.x (SDK 58),
      # а worklets 0.5.1 из SDK 54 требует peer `@babel/core ^7`. Поэтому
      # bump @babel/core → 8 тянет за собой весь SDK и валит `npm ci`.
      # `@babel/*` целиком: та же история у preset/plugin-пакетов.
      - dependency-name: '@babel/*'
      # --- @react-navigation/* ---
      # Намеренно НЕ заглушены: SDK их не пинит, они живут своей версионной
      # веткой. НО dependabot поднимает их по одному, а они связаны жёстко:
      # `bottom-tabs@7` и `native-stack@7` требуют `native ^7.5.2`, поэтому
      # любой одиночный PR падает на `npm ci` с ERESOLVE (см. закрытые #34,
      # #40). Переход 6 → 7 проверен и возможен — все три пакета сразу,
      # с прогоном сборки. Пока это делается вручную, отдельной задачей.
      - dependency-name: '@react-navigation/bottom-tabs'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-navigation/native-stack'
        update-types: ['version-update:semver-major']
      # `native` намеренно оставлен: его мажор приходит один и его видно.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "deps(ci)"
