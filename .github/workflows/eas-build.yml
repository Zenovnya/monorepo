name: EAS Build (Mobile)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Профиль сборки (preview / production)'
        required: true
        default: 'preview'
  push:
    branches:
      - main
    paths:
      - 'mobile/**'

jobs:
  build:
    name: Build and submit mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Run EAS Build
        run: npx eas-cli build --platform all --profile ${{ inputs.profile || 'preview' }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}