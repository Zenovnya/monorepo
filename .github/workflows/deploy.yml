name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'mobile/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'mobile/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sourcecraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sourcecraft
      REDIS_URL: redis://localhost:6379
      # JWT-секрет для CI-миграций и тестов (32+ символов).
      JWT_SECRET_KEY: ci-only-development-secret-key-0123456789abcdef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      # Шаг был объявлен одной строкой «- name: Run tests» без `run`. GitHub
      # считает такой воркфлоу невалидным и НЕ ЗАПУСКАЕТ его целиком — ни
      # миграции, ни тесты. Проверка перед MVP была формальностью: 8 прогонов
      # подряд упали за 0 секунд ещё до первого шага.
      - name: Run tests
        run: python -m pytest -p no:cacheprovider -q 2>&1 | tee pytest.log

      # Падение теста должно быть видно там, где его читают. Логи воркфлоу
      # скачиваются только из веб-интерфейса и недоступны из скриптов, поэтому
      # причину пишем прямо в PR: иначе «Tests ✗» — это загадка без деталей.
      - name: Report test failures to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### Упали тесты (`pytest`)'
            echo
            echo '```'
            tail -c 3000 pytest.log || echo 'лог недоступен'
            echo '```'
          } > /tmp/failure.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/failure.md

      - name: Seed content and smoke-check API
        env:
          ADMIN_TOKEN: ci-admin-token
        run: |
          bash scripts/ci-smoke.sh

  mobile-lint:
    name: Lint (mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint
