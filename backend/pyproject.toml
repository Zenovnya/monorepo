[tool.ruff]
# Проверяем только код backend-приложения и тесты.
src = ["app"]
# Alembic-миграции генерируются автоматически — их не линтуем.
extend-exclude = ["migrations/"]

[tool.ruff.lint]
# Базовые значимые правила: синтаксис (E), неопределённые имена (F),
# неиспользуемые импорты (F401), неиспользуемые переменные (F841).
# Стилистические W292 (новая строка в конце файла) и E501 (длина строки)
# отключены — они не сигнализируют об ошибках кода.
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# В тестах разрешаем неиспользуемые импорты для удобства (fixtures, helpers).
"tests/**" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"